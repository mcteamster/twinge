name: E2E

# E2E tests run against the live AU deployment. There is no local server mode,
# so these run after a push to main (by which point the AU stack reflects the
# merged change) and can be pointed elsewhere via the BASE_URL env var.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test against'
        required: false
        default: 'https://au.twinge.mcteamster.com'

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run E2E tests
        run: npm test --workspace e2e
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://au.twinge.mcteamster.com' }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
