name: E2E

# E2E tests build the client locally and serve it via `vite preview`, then
# run against http://localhost:4173. This ensures the test region constants
# (TEST endpoint, globalSetup storageState) are always in the build under test
# rather than whatever is currently deployed to prod.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build --workspace client

      - name: Start dev server
        run: npm run serve --workspace client &
        # vite preview (aliased as serve) runs on port 4173 by default

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run E2E tests
        run: npm test --workspace e2e
        env:
          BASE_URL: http://localhost:4173

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
