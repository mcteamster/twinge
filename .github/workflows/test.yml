name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck client
        run: npm run tsc -w client

      - name: Lint service
        run: npm run lint -w service

      - name: Typecheck service
        run: npx tsc --project service/tsconfig.json --noEmit

      - name: Test service
        run: npm test -w service

      - name: Test client
        run: npm test -w client
